name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # This repo had no CI at all until now -- build.yml triggers only on v* tags, so
  # nothing ran on a pull request and backend/tests/ had never been executed by
  # anything. Renovate started opening dependency PRs here on 2026-08-21 (#9-#13,
  # including fastapi 0.115 -> 0.141 and httpx 0.27 -> 0.28), which are exactly the
  # changes that need a test run before merge.
  backend-tests:
    name: Backend Tests
    runs-on: ${{ vars.CI_RUNNER || 'vollminlab' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Run inside python:3.12-slim -- the same base the Dockerfile's runtime stage
      # uses -- rather than actions/setup-python. The dependency set is then the one
      # that actually ships, and it avoids relying on a Python toolchain being
      # present on a self-hosted runner (this fleet's image has python3 with no pip).
      # Built as an image rather than `docker run -v $PWD/backend:...`: the runner
      # talks to a separate dockerd (dind), so a bind mount of the workspace resolves
      # against THAT daemon's filesystem and silently yields an empty directory. A
      # build context is uploaded over the API and therefore works. `RUN pytest` makes
      # a test failure fail the build, and so the step.
      - name: Run backend tests against the image's base
        run: |
          set -euo pipefail
          base=$(grep -m1 'FROM python' Dockerfile | awk '{print $2}')
          echo "testing against $base"
          tf=$(mktemp)
          {
            echo "FROM $base"
            echo "WORKDIR /src"
            echo "COPY requirements.txt ."
            echo "RUN pip install --quiet --no-cache-dir -r requirements.txt pytest"
            echo "COPY . ."
            echo "RUN pytest -q"
          } > "$tf"
          docker build --no-cache -f "$tf" -t ci-backend-tests:${{ github.sha }} backend
          rm -f "$tf"

  docker-build:
    name: Docker Build
    runs-on: ${{ vars.CI_RUNNER || 'vollminlab' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The Dockerfile is multi-stage, so this one build also type-checks and bundles
      # the frontend (`tsc && vite build` in the node stage). A TypeScript error or a
      # broken npm dependency fails here.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ci-build:${{ github.sha }}

      # Building proves the layers assemble. It does not prove the runtime deps are
      # importable in the final stage -- which is precisely what a fastapi/httpx/redis
      # bump can break. Imports only the third-party packages, not the app module,
      # because app import may expect Redis to be reachable.
      - name: Verify runtime dependencies import in the final image
        run: |
          set +e
          set -uo pipefail
          out=$(docker run --rm --entrypoint python ci-build:${{ github.sha }} \
            -c 'import fastapi, uvicorn, httpx, redis; print("deps ok")' 2>&1); rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::runtime dependencies failed to import in the built image (exit $rc)"
            exit 1
          fi
